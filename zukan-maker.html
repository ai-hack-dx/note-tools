<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>架空生物図鑑メーカー｜名前と気分の絵文字3つで、あなたが図鑑に載る</title>
<style>
  :root{
    --ink:#233024; --paper:#f5f1e2; --line:#2f4a34; --accent:#a8622a; --sub:#6b6552; --leaf:#3f6b4a; --leaf2:#8fae6f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:linear-gradient(160deg,#e9e4cf 0%,#f2eedd 55%,#e3ddc4 100%);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    color:var(--ink); padding:24px 12px; line-height:1.7;
  }
  .wrap{max-width:560px;margin:0 auto;}
  h1.app{font-size:20px;text-align:center;letter-spacing:.05em;margin:0 0 4px;}
  p.lead{text-align:center;color:var(--sub);font-size:13px;margin:0 0 22px;}
  .panel{background:#fff;border:1px solid #d9d2b8;border-radius:10px;padding:18px;margin-bottom:22px;box-shadow:0 4px 16px rgba(60,70,40,.10);}
  label{font-size:13px;font-weight:bold;display:block;margin-bottom:6px;}
  input[type=text]{width:100%;padding:11px 12px;font-size:16px;border:1px solid #bbb;border-radius:8px;font-family:inherit;}
  .hint{font-size:11px;color:var(--sub);margin:4px 0 0;}
  .emojis{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .emojis button{font-size:22px;width:46px;height:46px;border:1px solid #ccc;background:#fafafa;border-radius:10px;cursor:pointer;transition:.15s;}
  .emojis button.on{background:var(--leaf);border-color:var(--leaf);transform:scale(1.08);}
  .emojis button.dis{opacity:.3;pointer-events:none;}
  .go{margin-top:16px;width:100%;padding:14px;font-size:16px;font-weight:bold;color:#fff;background:linear-gradient(135deg,var(--line),var(--leaf));border:none;border-radius:9px;cursor:pointer;letter-spacing:.1em;}
  .go:active{opacity:.85;}
  .hidden{display:none !important;}

  /* ===== 図鑑カード ===== */
  .card{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:0;overflow:hidden;box-shadow:0 10px 30px rgba(40,50,30,.20);}
  .card::before{content:"";position:absolute;inset:7px;border:1px solid rgba(47,74,52,.35);pointer-events:none;border-radius:2px;}
  .chead{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;border-bottom:2px solid var(--line);}
  .chead .no{font-family:"Courier New",monospace;font-size:12px;letter-spacing:.14em;color:var(--sub);}
  .chead .no b{display:block;font-size:20px;color:var(--ink);letter-spacing:.05em;}
  .chead .rarity{text-align:right;}
  .chead .rarity .stars{font-size:16px;color:#c99b2e;letter-spacing:1px;}
  .chead .rarity .rlabel{font-size:10px;color:var(--sub);letter-spacing:.16em;margin-top:1px;}
  .cbody{position:relative;z-index:1;padding:16px 18px 6px;text-align:center;}
  .species{font-size:26px;font-weight:bold;letter-spacing:.03em;line-height:1.25;}
  .latin{font-size:11px;color:var(--sub);letter-spacing:.1em;margin-top:3px;font-family:"Courier New",monospace;}
  .family{display:inline-block;margin-top:10px;font-size:11px;padding:3px 12px;border:1px solid var(--leaf);border-radius:999px;color:var(--leaf);letter-spacing:.06em;}
  .stats{display:flex;border-top:1px dashed #9a916f;border-bottom:1px dashed #9a916f;margin-top:14px;}
  .stats .cell{flex:1;padding:10px 6px;text-align:center;}
  .stats .cell+.cell{border-left:1px dashed #9a916f;}
  .stats .k{font-size:10px;color:var(--sub);letter-spacing:.08em;}
  .stats .v{font-size:13px;font-weight:bold;margin-top:3px;}
  .sec{position:relative;z-index:1;padding:12px 18px;}
  .sec h3{margin:0 0 7px;font-size:12px;letter-spacing:.1em;color:var(--leaf);display:flex;align-items:center;gap:6px;}
  .sec h3::before{content:"";width:6px;height:6px;background:var(--leaf);border-radius:50%;}
  .sec ul{margin:0;padding-left:18px;font-size:13.5px;}
  .sec ul li{margin-bottom:3px;}
  .sec p.desc{margin:0;font-size:13.5px;color:#3a3830;}
  .cfoot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:12px 18px 16px;border-top:1px dashed #9a916f;}
  .cfoot .observer{font-size:10px;color:var(--sub);line-height:1.5;}
  .cfoot .observer b{display:block;font-size:12px;color:var(--ink);}
  .stamp{width:52px;height:52px;border:2px solid var(--accent);color:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;transform:rotate(-8deg);text-align:center;line-height:1.2;letter-spacing:.02em;}

  .actions{display:flex;gap:10px;margin-top:16px;}
  .actions button{flex:1;padding:12px;font-size:14px;border:1px solid var(--ink);background:#fff;border-radius:9px;cursor:pointer;font-weight:bold;}
  .actions button.gacha{background:var(--ink);color:#fff;}
  .note{font-size:11px;color:var(--sub);text-align:center;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="app">架空生物図鑑メーカー</h1>
  <p class="lead">名前と「今の気分」の絵文字を3つ選ぶだけ。あなたが架空生物として図鑑に載ります。</p>

  <div class="panel">
    <label>① あなたの名前・呼び名</label>
    <input type="text" id="nm" placeholder="例：あなた／たろう／推しの名前" maxlength="16" autocomplete="off">
    <label style="margin-top:16px;">② 今の気分の絵文字を3つ選ぶ</label>
    <div class="emojis" id="emojis"></div>
    <p class="hint">選んだ順番も結果に影響します（<span id="selcount">0</span>/3 選択中）</p>
    <button class="go" id="go">図鑑に登録する</button>
  </div>

  <div class="card hidden" id="card">
    <div class="chead">
      <div class="no">図鑑番号<b id="cno">No.000</b></div>
      <div class="rarity"><div class="stars" id="cstars">★★★</div><div class="rlabel" id="crlabel">RARE</div></div>
    </div>
    <div class="cbody">
      <div class="species" id="cspecies">―</div>
      <div class="latin" id="clatin">―</div>
      <div class="family" id="cfamily">―</div>
      <div class="stats">
        <div class="cell"><div class="k">生息地</div><div class="v" id="chabitat">―</div></div>
        <div class="cell"><div class="k">危険度</div><div class="v" id="cdanger">―</div></div>
        <div class="cell"><div class="k">全長</div><div class="v" id="csize">―</div></div>
      </div>
    </div>
    <div class="sec">
      <h3>特徴</h3>
      <ul id="ctraits"></ul>
    </div>
    <div class="sec">
      <h3>生態観察メモ</h3>
      <p class="desc" id="cdesc">―</p>
    </div>
    <div class="cfoot">
      <div class="observer">観察日 <b id="cdate">―</b><br>記録者：今日から使えるAI実践帳</div>
      <div class="stamp" id="cstamp">観察<br>確認</div>
    </div>
  </div>

  <div class="actions hidden" id="actions">
    <button class="gacha" id="gacha">別個体を再観察</button>
    <button id="reset">入力をやり直す</button>
  </div>
  <p class="note hidden" id="savenote">スクリーンショットで保存してSNSにシェアできます</p>
</div>

<script>
const EMOJI = ["😀","😤","😴","🔥","🥹","😎","🫠","🤔","😇","🥶","🤩","😶‍🌫️"];
let selected = [];
const emojiBox = document.getElementById('emojis');
const selCountEl = document.getElementById('selcount');

function refreshEmojiState(){
  selCountEl.textContent = selected.length;
  [...emojiBox.children].forEach(b=>{
    const e = b.dataset.e;
    b.classList.toggle('on', selected.includes(e));
    b.classList.toggle('dis', selected.length>=3 && !selected.includes(e));
  });
}

EMOJI.forEach(e=>{
  const b=document.createElement('button');
  b.textContent = e; b.dataset.e = e;
  b.onclick = ()=>{
    const i = selected.indexOf(e);
    if(i>=0){ selected.splice(i,1); }
    else if(selected.length<3){ selected.push(e); }
    refreshEmojiState();
  };
  emojiBox.appendChild(b);
});
refreshEmojiState();

// 決定論ハッシュ（同入力＝同結果）
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return Math.abs(h);}
function pick(arr,n){ return arr[n % arr.length]; }

const PREFIX = ["ソラ","ヒカリ","カゲ","ミズ","ホノオ","ツキ","タイヨウ","カゼ","ユキ","モリ","イワ","ハナ","ホシ","アメ","クモ","ヤミ","アサ","ヨル"];
const CORE   = ["ウサ","トラ","キツネ","タヌキ","フクロウ","カメ","リュウ","トリ","ネコ","イヌ","クマ","サル","ウマ","シカ","カニ","オオカミ","ハリネズミ","カワウソ"];
const SUFFIX_BY_RANK = {
  N:["モドキ","ダマシ","コゾウ"],
  R:["ヌシ","マル","キバ"],
  SR:["ヒメ","オウ","ロード"],
  SSR:["ゴッド","キング","スピリット"]
};
const LATIN_A = ["Umbra","Lucent","Ferrus","Aqua","Ignis","Nox","Ventus","Terra","Gelu","Sylva"];
const LATIN_B = ["minorus","majesticus","errans","dormiens","vagans","ardens","lucidus","fragilis","invictus","serenus"];
const FAMILY_SUFFIX = "科";

const HABITATS = ["深い霧の森の奥","誰も知らない地下水路","街灯の裏の路地裏","満月の夜だけ現れる神社の裏山","古い図書館の書庫の隙間","締め切り直前のデスク周辺","始発電車の窓際の席","活火山のふもとの温泉地","雨上がりの水たまりの中","朝5時のコンビニ駐車場"];
const DANGERS = ["ほぼ無害","油断禁物","要観察","中〜高","不明（毎回変わる）"];
const SIZES = ["約12.3cm","約38.6cm","約91.4cm","約1.5m（体感）","計測不能（動き回るため）"];

const TRAIT_POOL = {
  "😀":["機嫌がいいと発光する","近づくと場が明るくなる","笑い声で仲間を呼ぶ習性がある"],
  "😤":["感情の起伏が縄張りの広さに直結する","鼻息で周囲の空気を揺らす","負けず嫌いな性格が甲羅（？）に表れている"],
  "😴":["1日の大半を休眠して過ごす","省エネモードに入ると誰も起こせない","夜行性というより不定期行性"],
  "🔥":["体温が高く周囲をほんのり暖める","やる気スイッチが入ると一気に加速する","燃費が悪いが火力は本物"],
  "🥹":["感受性が非常に高く涙腺が緩い","感動すると体色がわずかに変わる","優しい言葉に弱い"],
  "😎":["余裕のある佇まいで群れの中心になりやすい","動じない性格で警戒心が薄い","スタイリッシュな動き方をする"],
  "🫠":["液体化するほど脱力する瞬間がある","限界を迎えると姿勢を保てなくなる","休息を取ると急速に回復する"],
  "🤔":["何かを考え込むと動きが止まる","観察・分析が得意で判断が遅い","質問されると一拍置いてから答える"],
  "😇":["争いを好まず穏やかな気質","周囲の空気を和ませる不思議な力を持つ","善意で行動するが空回りしやすい"],
  "🥶":["寒さに強く低温でも活動できる","冷静沈着だが実は繊細","体温変化に敏感"],
  "🤩":["新しいものに目がなく好奇心旺盛","興奮すると鳴き声（？）が高くなる","刺激を求めて行動範囲が広い"],
  "😶‍🌫️":["感情を表に出さないが内側は複雑","霧のように輪郭が曖昧な瞬間がある","気配を消すのが得意"]
};

const DESC_TPL = [
  "{prefix}{core}{suffix}は、{habitat}で発見される。{t1}。{t2}。研究者の間では「{name}型」と呼ばれることもある。",
  "{prefix}{core}{suffix}という名で記録されているこの個体は、{habitat}を拠点に活動する。{t1}。{t2}。観察のたびに新しい発見がある。",
  "{habitat}を主な生息域とする{prefix}{core}{suffix}。{t1}。{t3}。行動パターンには個体差が大きいとされる。",
  "図鑑には「{prefix}{core}{suffix}」として記載されている。{t2}。{t3}。最近の調査で新たにわかってきたことも多い。"
];

let lastExtra = 0;

function fmtDate(){
  const d = new Date();
  return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
}

function render(extra){
  const nm = (document.getElementById('nm').value.trim() || "あなた");
  const emojiKey = selected.join('');
  const key = nm + "@" + emojiKey + "#" + extra;
  const h = hash(key);
  lastExtra = extra;

  const prefix = pick(PREFIX, hash(key+"_p"));
  const core = pick(CORE, hash(key+"_c"));

  const rarityRoll = hash(key+"_r") % 100;
  let rank, stars;
  if(rarityRoll < 45){ rank="N"; stars="★"; }
  else if(rarityRoll < 78){ rank="R"; stars="★★"; }
  else if(rarityRoll < 95){ rank="SR"; stars="★★★"; }
  else { rank="SSR"; stars="★★★★"; }
  const suffix = pick(SUFFIX_BY_RANK[rank], hash(key+"_sf"));

  const latin = pick(LATIN_A, hash(key+"_la")) + " " + pick(LATIN_B, hash(key+"_lb"));
  const family = core + FAMILY_SUFFIX;

  const habitat = pick(HABITATS, hash(key+"_h"));
  const danger = pick(DANGERS, hash(key+"_d"));
  const size = pick(SIZES, hash(key+"_sz"));

  const emojis = selected.length ? selected : ["🤔"];
  const traitPicks = [];
  emojis.forEach((e,i)=>{
    const pool = TRAIT_POOL[e] || TRAIT_POOL["🤔"];
    traitPicks.push(pick(pool, hash(key+"_t"+i)));
  });
  while(traitPicks.length<3){ traitPicks.push(pick(TRAIT_POOL["🤔"], hash(key+"_tf"+traitPicks.length))); }

  const speciesName = prefix+core+suffix;
  const descTpl = pick(DESC_TPL, hash(key+"_desc"));
  const desc = descTpl
    .replace("{prefix}",prefix).replace("{core}",core).replace("{suffix}",suffix)
    .replace("{habitat}",habitat)
    .replace("{t1}", traitPicks[0]).replace("{t2}", traitPicks[1]).replace("{t3}", traitPicks[2]||traitPicks[0])
    .replace("{name}", nm);

  document.getElementById('cno').textContent = "No."+String(1+h%899).padStart(3,'0');
  document.getElementById('cstars').textContent = stars;
  document.getElementById('crlabel').textContent = rank;
  document.getElementById('cspecies').textContent = speciesName;
  document.getElementById('clatin').textContent = latin;
  document.getElementById('cfamily').textContent = family;
  document.getElementById('chabitat').textContent = habitat.length>8 ? habitat.slice(0,7)+"…" : habitat;
  document.getElementById('cdanger').textContent = danger;
  document.getElementById('csize').textContent = size;
  document.getElementById('cdesc').textContent = desc;
  document.getElementById('cdate').textContent = fmtDate();
  document.getElementById('cstamp').innerHTML = rank==="SSR" ? "伝説<br>級" : "観察<br>確認";

  const traitsUl = document.getElementById('ctraits');
  traitsUl.innerHTML = '';
  traitPicks.slice(0,3).forEach(t=>{
    const li = document.createElement('li');
    li.textContent = t;
    traitsUl.appendChild(li);
  });

  document.getElementById('card').classList.remove('hidden');
  document.getElementById('actions').classList.remove('hidden');
  document.getElementById('savenote').classList.remove('hidden');
}

document.getElementById('go').onclick = ()=>{
  if(!document.getElementById('nm').value.trim()){ alert("名前を入れてください"); return; }
  if(selected.length<3){ alert("絵文字を3つ選んでください"); return; }
  render(0);
  document.getElementById('card').scrollIntoView({behavior:'smooth'});
};
document.getElementById('gacha').onclick = ()=> render(lastExtra+1);
document.getElementById('reset').onclick = ()=>{
  document.getElementById('card').classList.add('hidden');
  document.getElementById('actions').classList.add('hidden');
  document.getElementById('savenote').classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
};
</script>
</body>
</html>
